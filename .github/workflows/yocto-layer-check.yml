name: Yocto full layer check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer-check:
    name: yocto-check-layer
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out meta-reframe
        uses: actions/checkout@v4

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            chrpath cpio diffstat file gawk gcc git iputils-ping libacl1 \
            locales lz4 python3-git python3-jinja2 python3-pexpect \
            python3-pip python3-subunit socat texinfo unzip wget xz-utils zstd

      - name: Install kas
        run: python3 -m pip install --user "kas==5.3"

      - name: Enable unprivileged user namespaces for BitBake
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Resolve pinned repositories
        run: ~/.local/bin/kas checkout kas/reframe.yml

      - name: Run full Yocto layer checks
        run: |
          ~/.local/bin/kas shell kas/reframe.yml -c '
            set -eu
            bitbake-layers remove-layer .. meta-raspberrypi
            yocto-check-layer --no-auto --no-auto-dependency \
              --dependency ../meta-raspberrypi -- ..
          '
