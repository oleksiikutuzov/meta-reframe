<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
    "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
    "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The dashboard may install only RAUC-verified bundles. It does not gain
       permission to mark slots, write arbitrary slots, or control services. -->
  <policy user="reframe">
    <allow send_destination="de.pengutronix.rauc"
           send_path="/"
           send_interface="de.pengutronix.rauc.Installer"
           send_member="InstallBundle"/>
    <allow send_destination="de.pengutronix.rauc"
           send_path="/"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc"
           send_path="/"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
  </policy>
</busconfig>
