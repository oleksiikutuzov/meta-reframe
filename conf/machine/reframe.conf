#@TYPE: Machine
#@NAME: reFrame camera
#@DESCRIPTION: reFrame camera appliance based on Raspberry Pi Zero 2 W (64-bit)

require conf/machine/raspberrypi0-2w-64.conf

# Complete reFrame appliance configuration. Kas only needs to select this
# machine; direct BitBake users receive the same hardware and image policy.
DEBUG_BUILD = "1"
INIT_MANAGER = "systemd"
ENABLE_I2C = "1"
ENABLE_SPI_BUS = "1"
ENABLE_UART = "${@oe.utils.vartrue('DEBUG_BUILD', '1', '0', d)}"
VIDEO_CAMERA = "1"
RASPBERRYPI_CAMERA_V3 = "1"
hostname:pn-base-files = "reframe"

# Headless firmware and kernel-console latency settings. Debug images retain
# the serial console as the recovery path; release images suppress routine
# kernel chatter.
DISABLE_SPLASH = "1"
DISABLE_RPI_BOOT_LOGO = "1"
CMDLINE_DEBUG = "${@oe.utils.vartrue('DEBUG_BUILD', '', 'quiet loglevel=3', d)}"
RPI_EXTRA_CONFIG = "dtoverlay=disable-bt\nhdmi_blanking=2\nboot_delay=0\ndisplay_auto_detect=0\ndisable_poe_fan=1\nforce_eeprom_read=0\nenable_tvout=0"

# Required by the Pi Zero 2 W Wi-Fi firmware recipe.
LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
